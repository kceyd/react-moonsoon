server.port=${PORT:8082}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/moonsoon_usuarios?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# El secreto JWT debe tener 32+ caracteres y ser IGUAL en ms-usuarios y ms-productos
jwt.secret=${JWT_SECRET:cambiar-este-secreto-en-produccion-32chars-min}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
admin.email=${ADMIN_EMAIL:admin@moonsoon.cl}
admin.password=${ADMIN_PASSWORD:Admin123!}
